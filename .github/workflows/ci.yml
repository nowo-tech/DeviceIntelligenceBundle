name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Dispatched by dependabot-assets.yml on a Dependabot branch after it pushed the rebuilt assets (a push made with
  # GITHUB_TOKEN starts no workflow), so the required checks run on the rebuilt head (audit ZAWD-L2).
  workflow_dispatch:

env:
  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  COMPOSER_MAX_PARALLEL_HTTP: 4

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  # REQ-SF-002: Symfony 7.4+ and 8.x (7.4, 8.1, 8.2).
  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        php: ['8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1', '8.2']
        exclude:
          - php: '8.3'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.2'

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.2') }}
    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.2
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: env.HEAVY == 'true'

      - name: Validate composer.json
        run: composer validate --strict
        if: env.HEAVY == 'true'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        if: env.HEAVY == 'true'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
        if: env.HEAVY == 'true'

      # Symfony 8.x requires php >=8.4.1; Composer treats "8.4" as 8.4.0 and rejects it.
      - name: Override platform for Symfony 8 (requires PHP 8.4.1+)
        if: env.HEAVY == 'true' && startsWith(matrix.symfony, '8.')
        run: composer config platform.php 8.4.1

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"
        if: env.HEAVY == 'true'

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          chmod +x .scripts/retry.sh
          composer require \
            "symfony/cache:^${{ matrix.symfony }}" \
            "symfony/config:^${{ matrix.symfony }}" \
            "symfony/dependency-injection:^${{ matrix.symfony }}" \
            "symfony/http-foundation:^${{ matrix.symfony }}" \
            "symfony/http-kernel:^${{ matrix.symfony }}" \
            "symfony/framework-bundle:^${{ matrix.symfony }}" \
            "symfony/messenger:^${{ matrix.symfony }}" \
            "symfony/routing:^${{ matrix.symfony }}" \
            "symfony/security-bundle:^${{ matrix.symfony }}" \
            "symfony/serializer:^${{ matrix.symfony }}" \
            "symfony/rate-limiter:^${{ matrix.symfony }}" \
            "symfony/uid:^${{ matrix.symfony }}" \
            "symfony/validator:^${{ matrix.symfony }}" \
            "symfony/yaml:^${{ matrix.symfony }}" \
            --no-interaction --no-update
          if [[ "${{ matrix.symfony }}" == 8.* ]]; then
            composer require "doctrine/doctrine-bundle:^3.0" "doctrine/orm:^3.0" --no-interaction --no-update
          fi
          ./.scripts/retry.sh -- composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
        if: env.HEAVY == 'true'
      - name: Composer audit (Critical/High)
        run: composer audit --locked
        if: env.HEAVY == 'true'


      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test
        if: env.HEAVY == 'true'

      - name: Run tests with coverage (PHP 8.3 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && (matrix.php == '8.3' && matrix.symfony == '7.4')
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test-coverage

      # symfony/asset and symfony/translation are optional for hosts: the framework prepend must not require them.
      - name: Host kernel without symfony/asset and symfony/translation
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          # nowo-tech/user-kit-bundle (GDPR bridge tests) pulls symfony/asset and symfony/translation through UiKit / FormKit.
          composer remove --dev symfony/asset symfony/translation nowo-tech/user-kit-bundle --no-interaction --no-progress
          if [ -d vendor/symfony/asset ] || [ -d vendor/symfony/translation ]; then
            echo "symfony/asset or symfony/translation is still installed (pulled by another package)"
            exit 1
          fi
          vendor/bin/phpunit --no-coverage tests/Integration/Kernel
        if: env.HEAVY == 'true'

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, cs2pr
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

  # Release gates (docs/GITHUB_CI.md#release-gates-in-full-mode): the `make release-check` gates that no other job of
  # this workflow runs on every push. One matrix cell per gate, so the PR checks list names the gate that failed. Each
  # cell runs the repo's own Makefile target with $(COMPOSE) pointed at the runner (CI and release-check run the same
  # recipe); a repo whose Makefile does not define the target passes that cell with a notice, so this block is the same
  # in every bundle. Not a required check. Light mode: the cells pass after one echo step (never skipped at job level,
  # same as the test matrix, so the contexts keep their names if they are ever made required).
  release-gates:
    name: Release gate (make ${{ matrix.gate }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}

    strategy:
      fail-fast: false
      matrix:
        gate: ['rector-dry', 'validate-phpdoc', 'validate-translations', 'check-twig-extra']

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      GATE: ${{ matrix.gate }}
    steps:
      - name: Light mode (deps/docs-only PR) - release gates run in full mode only
        if: env.HEAVY != 'true'
        run: echo "Light mode, this gate runs on full-mode PRs and on every push."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Is make ${{ matrix.gate }} defined in this repo?
        if: env.HEAVY == 'true'
        id: gate
        run: |
          # Defined = the Makefile has a rule with a recipe for the target. Skip only on these two exact make answers;
          # any other make error (broken Makefile, missing include) fails the cell instead of hiding the gate.
          run=false
          if [ ! -f Makefile ]; then
            reason="no Makefile in this repo"
          else
            set +e
            plan=$(LC_ALL=C make -n -o ensure-up -o install "$GATE" 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && printf '%s\n' "$plan" | grep -qF "No rule to make target '$GATE'.  Stop."; then
              reason="the Makefile has no '$GATE' target"
            elif [ "$rc" -eq 0 ] && printf '%s\n' "$plan" | grep -qF "Nothing to be done for '$GATE'."; then
              reason="the Makefile declares '$GATE' without a recipe"
            elif [ "$rc" -ne 0 ]; then
              printf '%s\n' "$plan"
              echo "::error title=Release gate $GATE::make -n $GATE failed (exit $rc), see the output above"
              exit 1
            else
              run=true
              echo "make $GATE runs (docker compose exec/run prefixes are dropped, the command runs on the runner):"
              printf '%s\n' "$plan"
            fi
          fi
          if [ "$run" = false ]; then
            echo "::notice title=Release gate $GATE skipped::$reason, nothing to check."
            echo "Release gate \`$GATE\` skipped: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.gate.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # same PHP as this workflow's phpstan job
          php-version: '8.4'
          tools: composer:v2

      - name: Get Composer cache directory
        if: steps.gate.outputs.run == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-release-gates-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-release-gates-composer-
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: make ${{ matrix.gate }}
        if: steps.gate.outputs.run == 'true'
        run: |
          # Stand-in for `docker compose`: `[global options] exec|run [options] <service> <command...>` runs <command>
          # here (-e VAR=value is exported, an absolute binary path missing on the runner is looked up on PATH). Any
          # other compose call (up, ps, ...) fails loudly: the gate needs a stack CI does not start.
          shim="$RUNNER_TEMP/compose-on-runner"
          cat > "$shim" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          sub=""
          while [ $# -gt 0 ]; do
            case "$1" in
              exec|run) sub=$1; shift; break ;;
              -f|--file|-p|--project-name|--project-directory|--env-file|--profile|--ansi|--progress) shift 2 ;;
              -*) shift ;;
              *) break ;;
            esac
          done
          if [ -z "$sub" ]; then echo "compose-on-runner: 'compose $*' needs the Docker stack, CI has none" >&2; exit 1; fi
          while [ $# -gt 0 ]; do
            case "$1" in
              -e|--env) export "$2"; shift 2 ;;
              --env=*) export "${1#--env=}"; shift ;;
              -w|--workdir|-u|--user|--name|--entrypoint|--index) shift 2 ;;
              -*) shift ;;
              *) shift; break ;;
            esac
          done
          if [ $# -eq 0 ]; then echo "compose-on-runner: no command after the service" >&2; exit 1; fi
          if [ "${1#/}" != "$1" ] && [ ! -x "$1" ]; then set -- "${1##*/}" "${@:2}"; fi
          exec "$@"
          SHIM
          chmod +x "$shim"
          make -o ensure-up -o install COMPOSE="$shim" COMPOSE_BIN="$shim" "$GATE"


  igor:
    name: Igor (FrankenPHP worker audit)
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # REQ-RUNTIME-003: persistence and two-connection race tests on real MySQL 8.4, MariaDB 11.4 and PostgreSQL 16 (IDENTITY
  # and SEQUENCE ids, audits LI-DI-L1 / LI-DI-M1), on DBAL 3 and DBAL 4.
  database:
    name: Databases (MySQL 8.4, MariaDB 11.4, PostgreSQL 16) - DBAL ${{ matrix.dbal }}
    needs: changes
    # Never skip this job: a skipped matrix job reports its un-expanded name and the required contexts never
    # appear. In light mode its steps are gated by HEAVY instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dbal: ['3', '4']

    services:
      mysql:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder
          MYSQL_DATABASE: di_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-placeholder" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: ${{ needs.changes.outputs.mode != 'light' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: ci-placeholder
          MARIADB_DATABASE: di_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: ${{ needs.changes.outputs.mode != 'light' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: di_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: env.HEAVY == 'true'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        if: env.HEAVY == 'true'

      - name: Use DBAL 3
        if: env.HEAVY == 'true' && matrix.dbal == '3'
        run: |
          composer update doctrine/dbal --with "doctrine/dbal:^3.8.2" --with-all-dependencies --prefer-dist --no-progress --no-interaction
          composer show doctrine/dbal

      - name: Persistence tests on MySQL, MariaDB, PostgreSQL and PostgreSQL with SEQUENCE ids
        timeout-minutes: 10
        run: |
          set -e
          for target in \
            'identity pdo-mysql://root:ci-placeholder@127.0.0.1:3306/di_test?serverVersion=8.4.0&charset=utf8mb4' \
            'identity pdo-mysql://root:ci-placeholder@127.0.0.1:3307/di_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4' \
            'identity pdo-pgsql://postgres:ci-placeholder@127.0.0.1:5432/di_test?serverVersion=16&charset=utf8' \
            'sequence pdo-pgsql://postgres:ci-placeholder@127.0.0.1:5432/di_test?serverVersion=16&charset=utf8'; do
            echo "::group::${target%%\?*}"
            DI_TEST_ID_GENERATION="${target%% *}" DI_TEST_DATABASE_URL="${target#* }" \
              vendor/bin/phpunit --no-coverage --filter 'DoctrinePersistenceKernelTest|DbalEntityWriterTest|PersonalDataKernelTest'
            echo "::endgroup::"
          done
        if: env.HEAVY == 'true'

      - name: Two-connection races and conflict answers (REQ-RUNTIME-003)
        timeout-minutes: 10
        env:
          DEVICE_INTELLIGENCE_TEST_MYSQL_URL: mysql://root:ci-placeholder@127.0.0.1:3306/di_test?serverVersion=8.4.0&charset=utf8mb4
          DEVICE_INTELLIGENCE_TEST_MARIADB_URL: mysql://root:ci-placeholder@127.0.0.1:3307/di_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          DEVICE_INTELLIGENCE_TEST_PGSQL_URL: pgsql://postgres:ci-placeholder@127.0.0.1:5432/di_test?serverVersion=16
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Integration/Concurrency
        if: env.HEAVY == 'true'

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/device-intelligence-bundle` without updating them), and the demo lock must install
  # what the bundle requires (the demo installs from its lock, so a requirement added later is never installed and the
  # demo fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan --no-interaction

      - name: Test suite at the floor
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage

  look-alike-identifiers:
    name: Look-alike user identifiers on MySQL 8.4 and MariaDB 11.4 (REQ-SEC-006)
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder
          MYSQL_DATABASE: di_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-placeholder" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-placeholder
          MARIADB_DATABASE: di_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Look-alike tests (SQLite NOCASE, MySQL 8.4, MariaDB 11.4)
        env:
          DEVICE_INTELLIGENCE_TEST_MYSQL_URL: mysql://root:ci-placeholder@127.0.0.1:3306/di_test?serverVersion=8.4.0&charset=utf8mb4
          DEVICE_INTELLIGENCE_TEST_MARIADB_URL: mysql://root:ci-placeholder@127.0.0.1:3307/di_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
        run: vendor/bin/phpunit --no-coverage tests/Integration/LookAlike

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json
          coverage: pcov
          # REQ-TEST-003: instrument lib/ too (pcov defaults to src/ only).
          ini-values: pcov.directory=., pcov.exclude="~(vendor|demo|node_modules|coverage|tests)~"
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Translation YAML + key parity (REQ-I18N-002 / REQ-MAKE-004)
        run: php .scripts/validate-translations.php

      - name: Run tests with coverage (gate >= 99% lines, REQ-TEST-003)
        run: composer coverage-check

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  typescript:
    name: TypeScript tests
    needs: changes
    # Light mode: skipped (a skipped non-matrix job reports its own name as success).
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript tests with coverage
        run: pnpm run test:coverage
